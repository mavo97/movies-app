<div class="container" *ngIf="!loading">
  <!-- <div class="slider-main">
    <div class="container" *ngIf="!loading">
      <app-trendings-slider [tMovies]="trendingMovies"></app-trendings-slider>
      <br />
    </div>
  </div> -->
  <div class="main-content" id="main-container">
    <!-- <div class="row container mb-3" *ngIf="loading">
      <mat-progress-bar mode="query" color="primary"></mat-progress-bar>
    </div> -->
    <div class="row mb-2">
      <div class="col-md-12 mb-2">
        <button
          mat-raised-button
          color="primary"
          (click)="openDialog()"
          *appUserIn="true"
        >
          Crear lista
        </button>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="fill">
          <mat-label>Género</mat-label>
          <mat-select
            (selectionChange)="selectGenre($event.value, true)"
            [disabled]="loading"
          >
            <mat-option [value]="0">Todos</mat-option>
            <mat-option *ngFor="let genre of genres" [value]="genre.id">
              {{ genre.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div
      class="row row-cols-2 row-cols-md-6"
      *ngIf="moviesToDisplay.length > 0"
    >
      <div class="col" *ngFor="let movie of moviesToDisplay">
        <div class="card border-0 h-100">
          <app-movie-poster
            [imgSrc]="movie | imageSrc"
            [vote_average]="movie.vote_average"
            [selectButton]="true"
            [release_date]="movie.release_date"
            [id]="movie.id"
          >
          </app-movie-poster>
          <div class="card-body">
            <h5 class="card-title fs-6 lh-sms">{{ movie.title }}</h5>
            <p class="card-text">
              {{ movie.release_date | date : "MMMM d, yyyy" | titlecase }}
            </p>
          </div>
        </div>
      </div>
    </div>
    <div class="row" *ngIf="moviesToDisplay.length === 0 && !loadingMovies">
      <div class="col-sm-12">
        <div class="alert alert-info" role="alert">
          No se encontraron resultados!
        </div>
      </div>
    </div>
    <div *ngIf="loadingMovies" class="loadingMoviesClass">
      <app-loadingcomponent></app-loadingcomponent>
    </div>
  </div>
  <ng-container *ngIf="!genre && !loadingPaginator">
    <app-paginator
      [pagesArray]="pagesArray"
      [totalPages]="totalPages"
      [page]="pageId"
      (newIndexValue)="sliceListMovies(true, $event)"
    ></app-paginator>
  </ng-container>
  <ng-container *ngIf="genre && !loadingPaginator">
    <app-paginator
      [pagesArray]="pagesArray2"
      [totalPages]="totalPages"
      [genreSelected]="genreSelected"
      [page]="pageId"
      [genre]="genre"
      (newIndexValue)="sliceListMoviesByGenre(true, $event)"
    ></app-paginator>
  </ng-container>
  <ng-container *ngIf="!loading">
    <app-movies-list-button *appUserIn></app-movies-list-button>
  </ng-container>
  <app-whats-app-button></app-whats-app-button>
</div>
<!-- <app-loadingcomponent *ngIf="loading"></app-loadingcomponent> -->
<div class="container pt-5" *ngIf="loading">
  <h1 class="text-center mb-3">Cargando...</h1>
  <app-loading-with-percent
    [listMovies]="listMovies"
    [total_results]="total_results"
  ></app-loading-with-percent>
</div>
